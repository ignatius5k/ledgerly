name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - codex/firebase-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Node and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact npm version
        run: |
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Require Chrome browser coverage
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify vendored dependencies
        run: npm run verify:vendor

      - name: Run application and infrastructure tests
        run: npm test

      - name: Install Java for the Firestore emulator
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firebase authentication, invoice PDF storage, rules, and browser workflow
        run: npm run test:firebase

      - name: Install WebKit for Safari engine coverage
        run: npx playwright-core install --with-deps webkit

      - name: Verify WebKit desktop and iPhone invoice workflows
        run: npm run test:webkit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-test production build
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/redesign.css
          grep -F "frame-ancestors 'none'" dist/_headers

      - name: Reject whitespace errors and generated changes
        run: |
          git diff --check
          git diff --exit-code

      - name: Build Firebase app for GitHub Pages
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.ref == 'refs/heads/codex/firebase-prototype' && github.event_name == 'workflow_dispatch')
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          test -n "$FIREBASE_WEB_CONFIG" || { echo "Set the FIREBASE_WEB_CONFIG repository secret before deploying Pages."; exit 1; }
          npm run build
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const window = {};
          vm.runInNewContext(fs.readFileSync('dist/firebase-config.js', 'utf8'), { window }, { timeout: 1000 });
          const config = window.INVOICE_FIREBASE_CONFIG;
          for (const key of ['apiKey', 'authDomain', 'projectId', 'appId', 'storageBucket']) {
            assert.equal(typeof config?.[key], 'string', `Pages build is missing Firebase ${key}`);
            assert.ok(config[key].trim(), `Pages build has empty Firebase ${key}`);
          }
          assert.ok(fs.statSync('dist/vendor/firebase-client.js').size > 0, 'Pages build is missing the Firebase SDK');
          console.log('Firebase configuration and SDK are present in the Pages build.');
          NODE

      - name: Upload GitHub Pages artifact
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.ref == 'refs/heads/codex/firebase-prototype' && github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.ref == 'refs/heads/codex/firebase-prototype' && github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified app
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
