name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Node and npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify exact npm version
        run: |
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Require Chrome browser coverage
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome_path"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify vendored dependencies
        run: npm run verify:vendor

      - name: Run application and infrastructure tests
        run: npm test

      - name: Install Java for the Firestore emulator
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firebase authentication, invoice PDF storage, rules, and browser workflow
        run: npm run test:firebase

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Smoke-test production build
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/redesign.css
          grep -F "frame-ancestors 'none'" dist/_headers

      - name: Reject whitespace errors and generated changes
        run: |
          git diff --check
          git diff --exit-code
